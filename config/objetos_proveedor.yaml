# Definición del objeto Proveedor: entidad raíz del servicio proveedor.
#
# name: nombre único del objeto en el catálogo. El servicio lo referencia desde
#   su clave raiz.
# related_api: CRUD que almacena el objeto (clave de conf/app.conf).
# related_table: tabla del CRUD.
# endpoint: ruta del recurso en ese CRUD.
# natural_key: campos que identifican un proveedor existente en la escritura
#   idempotente. Deben ser writable.
# campos: tabla de campos tipada. Cada campo declara:
#   type: tipo de almacenamiento (boolean, integer, jsonb, numeric, string,
#     timestamp o uuid). Obligatorio.
#   readable: el campo se entrega en lectura.
#   writable: el cliente puede enviar el campo en una escritura.
#   immutable: el campo no cambia tras la creación. Exige writable.
# referencias: objetos que este objeto referencia. La raíz se expande desde el
#   servicio, por eso la lista está vacía.
name: Proveedor
related_api: gestion_personas_crud
related_table: proveedor
endpoint: /v1/proveedor
natural_key:
  - TerceroId
campos:
  - name: TerceroId
    type: integer
    readable: true
    writable: true
    immutable: true
  - name: TipoRegistroId
    type: integer
    readable: true
    writable: true
  - name: DescripcionPortafolio
    type: string
    readable: true
    writable: true
referencias: []
