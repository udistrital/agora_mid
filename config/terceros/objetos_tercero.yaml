# Configuración mínima del dominio 1: tercero y su identificación.
# Solo declara los campos y la relación que el endpoint natural necesita.
name: Tercero
related_api: terceros
related_table: tercero
endpoint: /v1/tercero
campos:
    - name: Id
      type: integer
      nullable: false
      readable: true
      writable: false
      immutable: false
      required: false
    - name: NombreCompleto
      type: string
      nullable: false
      readable: true
      writable: true
      immutable: false
      required: false
    - name: PrimerNombre
      type: string
      nullable: true
      readable: true
      writable: true
      immutable: false
      required: false
    - name: SegundoNombre
      type: string
      nullable: true
      readable: true
      writable: true
      immutable: false
      required: false
    - name: PrimerApellido
      type: string
      nullable: true
      readable: true
      writable: true
      immutable: false
      required: false
    - name: SegundoApellido
      type: string
      nullable: true
      readable: true
      writable: true
      immutable: false
      required: false
    - name: LugarOrigen
      type: integer
      nullable: true
      readable: true
      writable: true
      immutable: false
      required: false
    - name: FechaNacimiento
      type: timestamp
      nullable: true
      readable: true
      writable: true
      immutable: false
      required: false
    - name: TipoContribuyenteId
      type: integer
      nullable: false
      readable: true
      writable: true
      immutable: false
      required: false
    - name: Activo
      type: boolean
      nullable: false
      readable: false
      writable: true
      immutable: false
      required: false
    - name: FechaCreacion
      type: timestamp
      nullable: false
      readable: false
      writable: false
      immutable: false
      required: false
    - name: FechaModificacion
      type: timestamp
      nullable: true
      readable: false
      writable: false
      immutable: false
      required: false
referencias:
    - objeto: DatosIdentificacion
      direction: related_to_local
      cardinality: many
      local_field: Id
      related_field: TerceroId
      key_propagation: fk
      policy:
        creatable: true
        updatable: true
        deletable: false
      depth: 3
      mapped_name: DatosIdentificacion
