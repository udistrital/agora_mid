# field_roles: mapa de esquema.tabla.columna a sus banderas de rol. Cada clave admite ANY
# en el esquema o en la tabla, nunca en la columna. La entrada más específica prevalece:
# esquema.tabla.columna > esquema.ANY.columna > ANY.tabla.columna > ANY.ANY.columna.
# Un campo sin entrada es legible y escribible. Cada entrada declara readable, writable
# e immutable; immutable: true exige writable: true.

# Auditoría administrada por el sistema en todo objeto.
ANY.ANY.id:
  readable: true
  writable: false
  immutable: false
ANY.ANY.activo:
  readable: false
  writable: false
  immutable: false
ANY.ANY.fecha_creacion:
  readable: false
  writable: false
  immutable: false
ANY.ANY.fecha_modificacion:
  readable: false
  writable: false
  immutable: false
ANY.ANY.usuario_modificacion_id:
  readable: false
  writable: true
  immutable: false

# Llave de retrorreferencia del padre: no se lee ni se escribe; el motor la conserva al
