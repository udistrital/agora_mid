# lookup: FK de solo lectura en formato esquema.tabla.columna. Emite una arista
# local_to_related de cardinalidad one en el objeto que porta la columna, sin propagación
# y sin verbos, aunque write declare política para el referenciado. Cada entrada es una
# cadena (profundidad 1) o un mapa con entrada, depth y mapped_name. Falla si la FK está
# también en expand, fk_inbound, flatten o blacklist, o si no es una FK del DBML.
