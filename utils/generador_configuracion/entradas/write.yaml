# Borrador pendiente de revisión.
#
# write: mapa de esquema.tabla a su política de escritura. Cada campo es opcional
# y vale false si se omite.
#   creatable, updatable, deletable: verbos admitidos. El generador copia la
#     política a las aristas cuyo objeto es esa tabla; no la escribe en el objeto.
#   natural_key: columnas que identifican un registro existente en la escritura
#     idempotente. Deben ser escribibles (no id ni campos de auditoría).
#
# La política de la raíz (proveedor) se declara en relaciones_proveedor.yaml, en
# write.policy, porque ninguna arista generada apunta a la raíz.

proveedores.proveedor:
  creatable: true
  updatable: true
  deletable: false
  natural_key:
    - tercero_id

proveedores.contacto:
